# Name of the GitHub Actions workflow
name: CI Docker Build

# Run the workflow whenever code is pushed to the repository
on:
  push:

# Define the jobs that will run
jobs:

  # Job responsible for building the Docker image
  build:

    # Use a clean Ubuntu Linux virtual machine
    runs-on: ubuntu-latest

    # Steps executed by the runner
    steps:

      # Step 1: Download the repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build the Docker image
      - name: Build Docker image
        run: docker build -t static-app:latest .
